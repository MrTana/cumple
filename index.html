<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cumpleaños</title>
<meta name="theme-color" content="#404395">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cumpleaños">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  :root {
    --bg: #f6f6f8; --card: #ffffff; --text: #1f2030; --muted: #6b6d80;
    --accent: #404395; --accent-soft: #e8e9f6; --line: #e3e3ea; --today: #d85959;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14151c; --card: #1d1f29; --text: #ececf3; --muted: #9a9cb0;
      --accent: #8d90e8; --accent-soft: #2a2c44; --line: #2b2d3a; --today: #ff7a7a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: "Open Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  .wrap {
    max-width: 640px; margin: 0 auto;
    padding: calc(16px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(16px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
  }
  header { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
  h1 { font-size: 1.3rem; margin: 0; }
  .gear {
    width: 42px; height: 42px; padding: 0; display: grid; place-items: center;
    background: var(--accent-soft); color: var(--accent); border-radius: 50%;
  }
  .gear svg { width: 22px; height: 22px; }
  .gear[aria-expanded="true"] { background: var(--accent); color: #fff; }
  .gear .punto { position: absolute; top: 0; right: 0; width: 10px; height: 10px; border-radius: 50%; background: var(--today); border: 2px solid var(--bg); }
  .menu {
    position: absolute; right: 0; top: calc(100% + 6px); z-index: 10; width: min(320px, calc(100vw - 32px));
    background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px;
    box-shadow: 0 8px 24px rgba(0,0,0,.18);
  }
  .menu[hidden] { display: none; }
  .menu button.full { width: 100%; margin-top: 10px; }
  .menu label:first-child { margin-top: 0; }
  button {
    font: inherit; cursor: pointer; border: 0; border-radius: 10px;
    padding: 10px 14px; background: var(--accent); color: #fff; font-weight: 600;
  }
  button.sec { background: var(--accent-soft); color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
  .prox-titulo { font-weight: 700; margin-bottom: 4px; }
  .prox { display: flex; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .prox:last-child { border-bottom: 0; padding-bottom: 0; }
  .prox .fecha {
    width: 48px; flex: 0 0 auto; text-align: center; line-height: 1.1; padding: 5px 0; border-radius: 10px;
    background: var(--accent-soft); color: var(--accent); font-weight: 700; font-size: 1.05rem;
  }
  .prox .fecha small { display: block; font-size: .68rem; font-weight: 600; text-transform: uppercase; letter-spacing: .03em; }
  .prox.hoy .fecha { background: var(--today); color: #fff; }
  html, body { overscroll-behavior-x: none; touch-action: pan-y; min-height: 100%; }
  .meses { touch-action: pan-x pan-y; }
  @keyframes entraIzq { from { opacity: 0; transform: translateX(-28px); } to { opacity: 1; transform: none; } }
  @keyframes entraDer { from { opacity: 0; transform: translateX(28px); } to { opacity: 1; transform: none; } }
  .anim-izq { animation: entraIzq .2s ease-out; }
  .anim-der { animation: entraDer .2s ease-out; }
  .muted { color: var(--muted); font-size: .9rem; }
  .meses { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 8px; scrollbar-width: thin; }
  .chip {
    flex: 0 0 auto; padding: 7px 12px; border-radius: 999px; border: 1px solid var(--line);
    background: var(--card); color: var(--text); font-weight: 600; font-size: .85rem; text-transform: capitalize;
  }
  .chip.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .chip small { opacity: .75; margin-left: 4px; font-weight: 400; }
  .nav { display: flex; align-items: center; justify-content: space-between; margin: 4px 0 10px; }
  .nav h2 { margin: 0; font-size: 1.15rem; text-transform: capitalize; }
  .nav button { padding: 8px 12px; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  li:last-child { border-bottom: 0; }
  li.pasado { opacity: .5; }
  .dia {
    width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center;
    background: var(--accent-soft); color: var(--accent); font-weight: 700; font-size: 1.1rem; flex: 0 0 auto;
  }
  li.hoy .dia { background: var(--today); color: #fff; }
  .info { min-width: 0; flex: 1; }
  .nombre { font-weight: 600; overflow-wrap: anywhere; }
  .badge { font-size: .8rem; font-weight: 700; color: var(--today); white-space: nowrap; }
  .vacio { text-align: center; padding: 24px 8px; }
  details summary { cursor: pointer; font-weight: 600; }
  label { display: block; margin: 10px 0 4px; font-size: .85rem; color: var(--muted); }
  input[type=text] {
    width: 100%; font: inherit; padding: 10px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text);
  }
  .msg { margin-top: 8px; font-size: .9rem; }
  .err { color: var(--today); }
  .gear { position: relative; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🎂 Cumpleaños</h1>
    <button class="gear" id="btnConfig" aria-label="Configuración" aria-haspopup="true" aria-expanded="false" aria-controls="menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.01a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h.01a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.01a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
      <span class="punto" id="punto" hidden></span>
    </button>
    <div class="menu" id="menu" hidden>
      <label for="clientId">ID de cliente de Google</label>
      <input type="text" id="clientId" placeholder="123456-abc.apps.googleusercontent.com" autocomplete="off" autocapitalize="off" spellcheck="false">
      <button class="sec full" id="guardarId">Guardar</button>
      <button class="full" id="btnConectar">Conectar con Google</button>
      <div class="msg" id="estado" role="status"></div>
    </div>
  </header>

  <div class="card" id="proximo" hidden></div>

  <div class="meses" id="meses"></div>

  <div class="card" id="tarjetaMes">
    <div class="nav">
      <button class="sec" id="prev" aria-label="Mes anterior">‹</button>
      <h2 id="tituloMes"></h2>
      <button class="sec" id="next" aria-label="Mes siguiente">›</button>
    </div>
    <ul id="lista"></ul>
  </div>

</div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
(function () {
  var SCOPE = 'https://www.googleapis.com/auth/contacts.readonly';
  var MESES = [];
  for (var i = 0; i < 12; i++) {
    MESES.push(new Intl.DateTimeFormat('es', { month: 'long' }).format(new Date(2026, i, 1)));
  }
  var hoy = new Date();
  var anioActual = hoy.getFullYear();
  var mes = hoy.getMonth();

  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} }

  var contactos = [];
  try { contactos = JSON.parse(lsGet('cumple_contactos') || '[]'); } catch (e) { contactos = []; }

  var $ = function (id) { return document.getElementById(id); };
  var estado = $('estado');

  var menu = $('menu'), btnConfig = $('btnConfig'), punto = $('punto');

  function abrirMenu(abrir) {
    menu.hidden = !abrir;
    btnConfig.setAttribute('aria-expanded', abrir ? 'true' : 'false');
  }

  // Un mensaje de error abre el menú para que se vea; el resto no estorba la página principal.
  function setEstado(texto, esError) {
    estado.textContent = texto || '';
    estado.className = 'msg' + (esError ? ' err' : '');
    estado.style.marginTop = texto ? '10px' : '0';
    punto.hidden = !esError;
    if (esError) abrirMenu(true);
  }

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined) n.textContent = text;
    return n;
  }

  function diasHasta(m, d) {
    var base = new Date(anioActual, hoy.getMonth(), hoy.getDate());
    var f = new Date(anioActual, m, d);
    if (f < base) f = new Date(anioActual + 1, m, d);
    return Math.round((f - base) / 86400000);
  }

  function renderProximo() {
    var box = $('proximo');
    box.textContent = '';
    if (!contactos.length) { box.hidden = true; return; }
    var proximos = contactos.map(function (c) { return { c: c, d: diasHasta(c.mes, c.dia) }; })
      .sort(function (a, b) { return a.d - b.d || a.c.nombre.localeCompare(b.c.nombre, 'es'); })
      .slice(0, 5);
    box.appendChild(el('div', 'prox-titulo', '🎉 Próximos cumpleaños'));
    proximos.forEach(function (p) {
      var fila = el('div', 'prox' + (p.d === 0 ? ' hoy' : ''));
      var fecha = el('div', 'fecha', String(p.c.dia));
      fecha.appendChild(el('small', '', MESES[p.c.mes].slice(0, 3)));
      fila.appendChild(fecha);
      var info = el('div', 'info');
      info.appendChild(el('div', 'nombre', p.c.nombre));
      var dow = new Intl.DateTimeFormat('es', { weekday: 'long' }).format(new Date(anioActual + (new Date(anioActual, p.c.mes, p.c.dia) < new Date(anioActual, hoy.getMonth(), hoy.getDate()) ? 1 : 0), p.c.mes, p.c.dia));
      info.appendChild(el('div', 'muted', dow.charAt(0).toUpperCase() + dow.slice(1)));
      fila.appendChild(info);
      fila.appendChild(el('div', 'badge', p.d === 0 ? '¡Hoy!' : p.d === 1 ? 'Mañana' : 'en ' + p.d + ' d'));
      box.appendChild(fila);
    });
    box.hidden = false;
  }

  function renderMeses() {
    var cont = $('meses');
    cont.textContent = '';
    for (var m = 0; m < 12; m++) {
      (function (m) {
        var n = contactos.filter(function (c) { return c.mes === m; }).length;
        var b = el('button', 'chip' + (m === mes ? ' on' : ''), MESES[m]);
        if (n) b.appendChild(el('small', '', String(n)));
        b.addEventListener('click', function () { mes = m; render(); });
        cont.appendChild(b);
        if (m === mes) setTimeout(function () { b.scrollIntoView({ inline: 'center', block: 'nearest' }); }, 0);
      })(m);
    }
  }

  function renderLista() {
    $('tituloMes').textContent = MESES[mes];
    var ul = $('lista');
    ul.textContent = '';
    var delMes = contactos.filter(function (c) { return c.mes === mes; })
      .sort(function (a, b) { return a.dia - b.dia || a.nombre.localeCompare(b.nombre, 'es'); });
    if (!delMes.length) {
      var li = el('li', 'vacio muted', contactos.length ? 'No hay cumpleaños este mes.' : 'Conecta tu cuenta de Google para ver tus cumpleaños.');
      li.style.justifyContent = 'center';
      ul.appendChild(li);
      return;
    }
    var esMesActual = mes === hoy.getMonth();
    delMes.forEach(function (c) {
      var esHoy = esMesActual && c.dia === hoy.getDate();
      var pasado = esMesActual && c.dia < hoy.getDate();
      var li = el('li', (esHoy ? 'hoy ' : '') + (pasado ? 'pasado' : ''));
      li.appendChild(el('div', 'dia', String(c.dia)));
      var info = el('div', 'info');
      info.appendChild(el('div', 'nombre', c.nombre));
      var dow = new Intl.DateTimeFormat('es', { weekday: 'long' }).format(new Date(anioActual, c.mes, c.dia));
      var det = dow.charAt(0).toUpperCase() + dow.slice(1);
      if (c.anio) det += ' · cumple ' + (anioActual - c.anio);
      info.appendChild(el('div', 'muted', det));
      li.appendChild(info);
      if (esHoy) li.appendChild(el('div', 'badge', '¡Hoy!'));
      else if (esMesActual && !pasado) {
        var d = c.dia - hoy.getDate();
        li.appendChild(el('div', 'badge', d === 1 ? 'Mañana' : 'en ' + d + ' d'));
      }
      ul.appendChild(li);
    });
  }

  function render() { renderProximo(); renderMeses(); renderLista(); }

  function cambiarMes(delta) {
    mes = (mes + 12 + delta) % 12;
    render();
    var t = $('tarjetaMes');
    var cls = delta > 0 ? 'anim-der' : 'anim-izq';
    t.classList.remove('anim-izq', 'anim-der');
    void t.offsetWidth;
    t.classList.add(cls);
  }

  var diag = { total: 0, conFecha: 0, soloTexto: 0 };

  async function cargarContactos(token) {
    var salida = [], pageToken = '';
    diag = { total: 0, conFecha: 0, soloTexto: 0 };
    do {
      var url = 'https://people.googleapis.com/v1/people/me/connections?personFields=names,birthdays&pageSize=1000'
        + '&sources=READ_SOURCE_TYPE_CONTACT&sources=READ_SOURCE_TYPE_PROFILE'
        + (pageToken ? '&pageToken=' + encodeURIComponent(pageToken) : '');
      var r = await fetch(url, { headers: { Authorization: 'Bearer ' + token } });
      var j = await r.json().catch(function () { return {}; });
      if (!r.ok) {
        var det = (j.error && j.error.message) ? j.error.message : '';
        throw new Error('Google respondió con error ' + r.status + (det ? ': ' + det : ''));
      }
      (j.connections || []).forEach(function (p) {
        diag.total++;
        var nombre = (p.names && p.names[0] && p.names[0].displayName) || '(sin nombre)';
        var bs = p.birthdays || [];
        var hallado = false;
        for (var i = 0; i < bs.length; i++) {
          var d = bs[i].date;
          if (d && d.month && d.day) {
            salida.push({ nombre: nombre, mes: d.month - 1, dia: d.day, anio: d.year || null });
            hallado = true;
            diag.conFecha++;
            break;
          }
        }
        if (!hallado && bs.length) diag.soloTexto++;
      });
      pageToken = j.nextPageToken || '';
    } while (pageToken);
    return salida;
  }

  function conectar() {
    var clientId = (lsGet('cumple_client_id') || '').trim();
    var escrito = $('clientId').value.trim();
    if (escrito && escrito !== clientId) { clientId = escrito; lsSet('cumple_client_id', clientId); }
    if (!clientId) {
      setEstado('Primero pega tu ID de cliente de Google.', true);
      return;
    }
    if (typeof google === 'undefined' || !google.accounts || !google.accounts.oauth2) {
      setEstado('No se cargó el inicio de sesión de Google. Revisa tu conexión y recarga.', true);
      return;
    }
    var btn = $('btnConectar');
    var cliente = google.accounts.oauth2.initTokenClient({
      client_id: clientId,
      scope: SCOPE,
      callback: async function (resp) {
        if (resp.error) { setEstado('No se pudo autorizar: ' + resp.error, true); btn.disabled = false; return; }
        setEstado('Cargando contactos…');
        try {
          contactos = await cargarContactos(resp.access_token);
          lsSet('cumple_contactos', JSON.stringify(contactos));
          if (!google.accounts.oauth2.hasGrantedAllScopes(resp, SCOPE)) {
            setEstado('No se concedió el permiso de contactos. Vuelve a conectar y deja marcada la casilla de ver tus contactos.', true);
          } else {
            setEstado(diag.total + ' contactos revisados · ' + diag.conFecha + ' con cumpleaños'
              + (diag.soloTexto ? ' · ' + diag.soloTexto + ' con fecha en formato de texto (no se pueden leer)' : '') + '.', diag.total === 0);
          }
          render();
          if (diag.total > 0 && !estado.classList.contains('err')) setTimeout(function () { abrirMenu(false); }, 2500);
        } catch (e) {
          setEstado(e.message, true);
        }
        btn.disabled = false;
      },
      error_callback: function (e) {
        setEstado('No se completó el inicio de sesión (' + (e && e.type ? e.type : 'error') + ').', true);
        btn.disabled = false;
      }
    });
    btn.disabled = true;
    cliente.requestAccessToken();
  }

  $('btnConectar').addEventListener('click', conectar);
  $('prev').addEventListener('click', function () { cambiarMes(-1); });
  $('next').addEventListener('click', function () { cambiarMes(1); });

  // Arrastrar el dedo: izquierda = mes siguiente, derecha = mes anterior.
  // Funciona sobre la lista del mes y sobre la fila de meses del cuerpo de la página.
  (function () {
    var x0 = 0, y0 = 0, t0 = 0, activo = false;
    var zona = document;
    zona.addEventListener('touchstart', function (e) {
      if (e.touches.length !== 1 || e.target.closest('#meses, .menu, input')) { activo = false; return; }
      x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; t0 = Date.now(); activo = true;
    }, { passive: true });
    zona.addEventListener('touchend', function (e) {
      if (!activo) return;
      activo = false;
      var t = e.changedTouches[0];
      var dx = t.clientX - x0, dy = t.clientY - y0;
      if (Math.abs(dx) < 50 || Math.abs(dx) < Math.abs(dy) * 1.5 || Date.now() - t0 > 800) return;
      cambiarMes(dx < 0 ? 1 : -1);
    }, { passive: true });
    zona.addEventListener('touchcancel', function () { activo = false; }, { passive: true });
  })();
  $('guardarId').addEventListener('click', function () {
    var v = $('clientId').value.trim();
    if (!v) { setEstado('Pega un Client ID válido.', true); return; }
    lsSet('cumple_client_id', v);
    setEstado('ID guardado. Ya puedes conectar.');
  });

  btnConfig.addEventListener('click', function (e) { e.stopPropagation(); abrirMenu(menu.hidden); });
  menu.addEventListener('click', function (e) { e.stopPropagation(); });
  document.addEventListener('click', function () { abrirMenu(false); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') abrirMenu(false); });

  $('clientId').value = lsGet('cumple_client_id') || '';
  if (!lsGet('cumple_client_id')) abrirMenu(true);
  if (location.protocol === 'file:') {
    setEstado('Abre esta página desde un servidor (por ejemplo http://localhost:8080); Google no permite el inicio de sesión desde un archivo local.', true);
  }
  render();

  // Al volver a la app (aunque estuviera abierta en segundo plano), siempre se muestra el mes actual.
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState !== 'visible') return;
    hoy = new Date(); anioActual = hoy.getFullYear(); mes = hoy.getMonth();
    render();
  });

  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  }
})();
</script>
</body>
</html>
